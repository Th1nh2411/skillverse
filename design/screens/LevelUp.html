<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lên cấp · SkillVerse mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#E9A23B}a:hover{color:#F5C77A}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<style>html{background:#0A0B09}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #11130F; color: #F3F0E7; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; padding: 56px 20px 28px; gap: 20px">

  <div style="font-size: 12px; font-weight: 700; color: #5CC2B0; letter-spacing: 1px">ĐÃ ĐƯỢC XÁC THỰC 3/3</div>

  <div style="width: 168px; height: 168px; border-radius: 50%; border: 6px solid #E9A23B; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 0 10px #2A2412">
    <span style="font-size: 14px; font-weight: 700; color: #D9C9A8">CẤP</span>
    <span style="font-size: 64px; font-weight: 800; line-height: 1; color: #E9A23B">4</span>
  </div>

  <div style="text-align: center; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800">Lửa bằng que</h1>
    <div style="font-size: 14px; color: #A9AB9C">Bạn thuộc top 18% người luyện kỹ năng này</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%">
    <div style="background: #1B1E17; border-radius: 14px; padding: 12px; text-align: center">
      <div style="font-size: 20px; font-weight: 800; color: #E9A23B">+400 XP</div>
      <div style="font-size: 12px; color: #A9AB9C">Tổng cấp 24 → 25</div>
    </div>
    <div style="background: #1B1E17; border-radius: 14px; padding: 12px; text-align: center">
      <div style="font-size: 15px; font-weight: 700; color: #5CC2B0; min-height: 24px; display: flex; align-items: center; justify-content: center">Người giữ lửa</div>
      <div style="font-size: 12px; color: #A9AB9C">Huy hiệu mới</div>
    </div>
  </div>

  <section style="width: 100%; border-radius: 18px; background: #F3F0E7; color: #11130F; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 800">Skill<span style="color: #9A6516">Verse</span></span>
      <span style="font-size: 11px; font-weight: 600; color: #55574C">Thẻ chia sẻ</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 48px; height: 48px; border-radius: 50%; background: #11130F; color: #E9A23B; font-weight: 700; display: flex; align-items: center; justify-content: center">MH</div>
      <div>
        <div style="font-size: 15px; font-weight: 700">Minh Hoàng đạt cấp 4</div>
        <div style="font-size: 12px; color: #55574C">Lửa bằng que · đã được cộng đồng xác thực</div>
      </div>
    </div>
  </section>

  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
    <a href="#" style="min-height: 52px; border-radius: 14px; background: #E9A23B; color: #1A1406; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"></path></svg>Chia sẻ thành tích</a>
    <a href="SkillTree.html" style="min-height: 52px; border-radius: 14px; background: #2A2E24; color: #F3F0E7; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Mở khóa tiếp: Lọc nước</a>
  </div>
</div>
</body>
</html>
