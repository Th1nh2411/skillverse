services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillverse
      POSTGRES_PASSWORD: skillverse
      POSTGRES_DB: skillverse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillverse"]
      interval: 3s
      retries: 20
  minio:
    image: pgsty/minio:latest # bản build cộng đồng của MinIO (image chính thức đã ngừng phát hành)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
  minio-init:
    image: pgsty/minio:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/skillverse-proofs;
      mc anonymous set none local/skillverse-proofs;
      exit 0;
      "
volumes:
  pgdata:
  miniodata:
